<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Example finding</title><desc id="desc">AGENTS.md line 3 asks for pnpm and line 4 asks for npm. The report suggests checking the lockfile and clarifying the intended tool.</desc><rect width="1200" height="520" rx="20" fill="#f3f7f7"/><rect x="32" y="32" width="1136" height="456" rx="14" fill="white" stroke="#dfe6e7"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><rect x="64" y="64" width="44" height="44" rx="10" fill="#fff0ed"/><text x="74" y="95" font-size="29" fill="#b74a42">↔</text><text x="128" y="77" font-size="12" fill="#067c77">NEEDS REVIEW</text><text x="128" y="108" font-size="25" font-weight="650" fill="#142b38">Competing package-manager choices</text><text x="1063" y="77" font-size="11" fill="#72818a">EXAMPLE</text><text x="64" y="158" font-size="15" fill="#657681">Different package managers are selected within the same static scope.</text><rect x="64" y="188" width="526" height="128" rx="9" fill="#f7f9fa" stroke="#dfe6e7"/><rect x="608" y="188" width="526" height="128" rx="9" fill="#f7f9fa" stroke="#dfe6e7"/><text x="84" y="218" font-size="13" fill="#142b38">AGENTS.md</text><text x="441" y="218" font-size="12" fill="#657681">Line 3 · Source 1</text><text x="628" y="218" font-size="13" fill="#142b38">AGENTS.md</text><text x="985" y="218" font-size="12" fill="#657681">Line 4 · Source 2</text><path d="M64 236h526M608 236h526" stroke="#dfe6e7"/><text x="84" y="280" font-family="monospace" font-size="17" fill="#274451">Use pnpm for this project.</text><text x="628" y="280" font-family="monospace" font-size="17" fill="#274451">Use npm for this project.</text><rect x="64" y="340" width="1070" height="98" rx="8" fill="#edf7f3"/><rect x="64" y="340" width="3" height="98" fill="#58a68c"/><text x="84" y="367" font-size="12" font-weight="700" fill="#2a7660">SUGGESTED NEXT STEP</text><text x="84" y="397" font-size="15" fill="#315f54">Check the project lockfile and choose the intended package manager.</text><text x="84" y="420" font-size="15" fill="#315f54">If the choices belong to different subprojects, make those conditions explicit.</text><text x="64" y="464" font-size="11" fill="#657681">Illustrated excerpt from the bundled fixture. Static evidence, not a claim about runtime behavior.</text></g></svg>